# GitHub Actions: run the test suite automatically.
# GitHub reads every .yml file in .github/workflows/ and runs it on its own servers.

name: Tests

# When to run: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, so don't give it write access.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # A "matrix" runs the same job several times with different settings.
    # The TLS part needs Python 3.15 built against OpenSSL 3.5+, so we check that on all three
    # operating systems (ubuntu-latest is Ubuntu 26.04, which ships OpenSSL 3.5).
    strategy:
      fail-fast: false # keep running the other combinations if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.15"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show what this runner supports
        run: python -m pqlab env

      - name: Run tests
        run: python -m pytest -v

  # Install the project as a package, the way a user would, and run the command from outside the
  # repository so it can't accidentally use the source files.
  package:
    name: Install as a package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install the package (not editable)
        run: python -m pip install .

      - name: Run the installed command
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          pqlab --version
          pqlab env
          pqlab kem
          pqlab bench --quick --json "" --svg ""
          pqlab demo
          pqlab inspect --openssl

  # Scan this lab's own code with the series' crypto-inventory-scanner (Project 2). It should find
  # ML-KEM as CURRENT and X25519 / ECDSA as LEGACY (quantum-vulnerable), and nothing BROKEN.
  self-scan:
    name: Crypto inventory of the lab's own code
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install crypto-inventory-scanner v0.9.0
        run: python -m pip install "crypto-inventory-scanner @ git+https://github.com/AccidentalSpaceMan/crypto-inventory-scanner@v0.9.0"

      - name: Scan pqlab/ (fail on anything BROKEN)
        run: |
          cryptoinv scan pqlab --no-color --fail-on broken --cbom pqlab.cbom.json
          grep -q '"ML-KEM' pqlab.cbom.json && echo "ML-KEM found in the CBOM"
